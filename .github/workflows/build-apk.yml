name: Build Android APK (냉장고를 부탁해)

# 게임을 APK 안에 통째로 내장(Capacitor)해서 빌드합니다.
#  · 로컬에 Android 도구(JDK·SDK)가 없어 GitHub 클라우드 러너에서 빌드합니다.
#  · 완성된 APK 는 Actions 실행 결과 페이지의 Artifacts 에서 내려받습니다.
#  · 대회 USB 제출용 — 게임이 APK 안에 들어 있어 인터넷 없이 실행됩니다.
#    (조별 실시간 협력 기능만 인터넷 필요 — MQTT)

on:
  workflow_dispatch:        # Actions 탭에서 수동 실행
  push:
    branches: [main]
    paths:                  # 게임/설정이 바뀔 때 자동 재빌드
      - 'index.html'
      - 'manifest.webmanifest'
      - 'icon-512.png'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true

      # 게임은 단일 HTML 자립본이라 www/ 에 그것만 넣으면 된다.
      # PWA 전용 태그(매니페스트 링크·서비스워커 등록)는 APK 안에서는 불필요하므로 제거한다
      # — Capacitor 는 https://localhost 로 서비스해 SW 가 등록되는데, 자산이 이미 로컬이라 의미가 없고
      #   캐시가 끼면 갱신 혼선만 생긴다.
      - name: Bundle game into www/
        run: |
          rm -rf www && mkdir -p www
          cp index.html www/index.html
          # <link rel="manifest"> 와 서비스워커 등록 <script> 블록 제거
          python3 - <<'PY'
          import io, re
          p = 'www/index.html'
          s = io.open(p, encoding='utf-8').read()
          before = len(s)
          s = s.replace('<link rel="manifest" href="./manifest.webmanifest">', '')
          s = re.sub(r"<script>\s*//\s*서비스워커 등록.*?</script>", "", s, flags=re.S)
          io.open(p, 'w', encoding='utf-8').write(s)
          print('PWA 태그 제거: %d → %d bytes' % (before, len(s)))
          PY
          echo "=== www/ 내용 ===" && ls -1 www && du -sh www

      - name: Prepare Capacitor
        run: |
          cat > package.json <<'JSON'
          { "name": "fridge-apk", "version": "1.0.0", "private": true }
          JSON
          npm install @capacitor/core@^6 @capacitor/cli@^6 @capacitor/android@^6
          # 앱 ID·이름 — 블라인드 규칙(학교명·실명 제외) 준수. 교육자료전 앱과 ID가 겹치지 않게 분리
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "kr.classroom.fridge",
            "appName": "냉장고를 부탁해",
            "webDir": "www",
            "android": { "allowMixedContent": true },
            "server": { "androidScheme": "https" }
          }
          JSON

      - name: Add Android platform & sync
        run: |
          npx cap add android
          npx cap sync android

      # 요강(교육용SW·AI분과) 앱 최소 기준: Android 11(API 30) 이상
      - name: Set minSdkVersion 30 (요강 요건)
        run: |
          F=android/variables.gradle
          sed -i 's/minSdkVersion = [0-9]*/minSdkVersion = 30/' "$F"
          echo "=== variables.gradle ===" && cat "$F"

      # 전체화면(몰입 모드) — 상태표시줄·내비게이션바를 숨겨 게임이 화면 전체를 쓰게 한다.
      # 시스템 바가 남아 있으면 세로 공간이 줄어 1280×800 설계가 눌려 보인다.
      - name: Enable immersive fullscreen
        run: |
          PKG_DIR=android/app/src/main/java/kr/classroom/fridge
          cat > "$PKG_DIR/MainActivity.java" <<'JAVA'
          package kr.classroom.fridge;

          import android.content.Context;
          import android.os.Bundle;
          import android.print.PrintAttributes;
          import android.print.PrintDocumentAdapter;
          import android.print.PrintManager;
          import android.view.View;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              hideSystemUI();
              // 🖨️ 네이티브 인쇄 다리 — WebView는 window.print()를 무시하므로,
              // 게임의 printReport()가 window.AndroidPrint.print()를 부르면
              // 안드로이드 인쇄 대화상자(실제 프린터 + PDF로 저장)를 연다.
              // @media print 규칙은 인쇄 어댑터가 그대로 적용한다.
              final WebView wv = this.bridge.getWebView();
              wv.addJavascriptInterface(new Object() {
                @JavascriptInterface
                public void print() {
                  runOnUiThread(new Runnable() {
                    @Override
                    public void run() {
                      try {
                        PrintManager pm = (PrintManager) getSystemService(Context.PRINT_SERVICE);
                        PrintDocumentAdapter adapter =
                            bridge.getWebView().createPrintDocumentAdapter("냉장고를부탁해_리포트");
                        pm.print("냉장고를 부탁해 리포트", adapter,
                            new PrintAttributes.Builder()
                                .setMediaSize(PrintAttributes.MediaSize.ISO_A4)
                                .build());
                      } catch (Exception e) { /* 인쇄 미지원 기기 — 조용히 무시 */ }
                    }
                  });
                }
              }, "AndroidPrint");
              // 📥 네이티브 저장 다리 — WebView는 blob 다운로드를 조용히 버리므로,
              // 게임의 엑셀 내보내기가 window.AndroidSave.save(파일명, MIME, 내용)을 부르면
              // MediaStore로 기기 [다운로드] 폴더에 저장한다 (minSdk 30이라 별도 권한 불필요).
              // @JavascriptInterface 는 WebView의 JS 브리지 스레드에서 돌므로 UI를 막지 않는다.
              wv.addJavascriptInterface(new Object() {
                @JavascriptInterface
                public boolean save(String name, String mime, String text) {
                  try {
                    android.content.ContentValues cv = new android.content.ContentValues();
                    cv.put(android.provider.MediaStore.Downloads.DISPLAY_NAME, name);
                    cv.put(android.provider.MediaStore.Downloads.MIME_TYPE, mime);
                    android.net.Uri uri = getContentResolver().insert(
                        android.provider.MediaStore.Downloads.EXTERNAL_CONTENT_URI, cv);
                    if (uri == null) return false;
                    java.io.OutputStream os = getContentResolver().openOutputStream(uri);
                    if (os == null) return false;
                    os.write(text.getBytes("UTF-8"));
                    os.close();
                    return true;
                  } catch (Exception e) { return false; } // 실패 시 게임 쪽이 안내 토스트를 띄운다
                }
              }, "AndroidSave");
            }

            // 포커스를 되찾을 때(알림창 등을 닫은 뒤)에도 다시 숨긴다
            @Override
            public void onWindowFocusChanged(boolean hasFocus) {
              super.onWindowFocusChanged(hasFocus);
              if (hasFocus) hideSystemUI();
            }

            private void hideSystemUI() {
              getWindow().getDecorView().setSystemUiVisibility(
                  View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                | View.SYSTEM_UI_FLAG_FULLSCREEN);
            }
          }
          JAVA
          echo "=== MainActivity.java ===" && cat "$PKG_DIR/MainActivity.java"
          # 테마에도 전체화면·노치 영역 사용을 지정 (앱 시작 순간부터 바가 안 보이게)
          ST=android/app/src/main/res/values/styles.xml
          python3 - "$ST" <<'PY'
          import sys, io, re
          p = sys.argv[1]
          s = io.open(p, encoding='utf-8').read()
          add = ('        <item name="android:windowFullscreen">true</item>\n'
                 '        <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>\n')
          # AppTheme.NoActionBar 스타일 블록 안에 삽입
          m = re.search(r'(<style name="AppTheme\.NoActionBar"[^>]*>\n)', s)
          if m and 'windowFullscreen' not in s:
              s = s[:m.end()] + add + s[m.end():]
              io.open(p, 'w', encoding='utf-8').write(s)
              print('styles.xml 전체화면 항목 추가')
          else:
              print('styles.xml 변경 없음 (대상 스타일 못 찾음 또는 이미 적용)')
          PY
          cat "$ST"

      - name: Apply app icon (icon-512.png)
        run: |
          SRC=icon-512.png
          if [ ! -f "$SRC" ]; then echo "no $SRC — 기본 아이콘 유지"; exit 0; fi
          if ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y imagemagick
          fi
          RES=android/app/src/main/res
          for pair in "mdpi 48" "hdpi 72" "xhdpi 96" "xxhdpi 144" "xxxhdpi 192"; do
            set -- $pair; d=$1; sz=$2
            dir="$RES/mipmap-$d"; mkdir -p "$dir"
            convert "$SRC" -background white -alpha remove -alpha off \
              -resize ${sz}x${sz} "$dir/ic_launcher.png"
            cp "$dir/ic_launcher.png" "$dir/ic_launcher_round.png"
          done
          # 적응형 아이콘 XML 제거 → 정사각 비트맵 그대로 표시(그림 잘림 방지)
          rm -f "$RES"/mipmap-anydpi-v26/ic_launcher.xml \
                "$RES"/mipmap-anydpi-v26/ic_launcher_round.xml

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Collect APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk 냉장고를부탁해.apk
          ls -lh 냉장고를부탁해.apk
          echo "=== 웹 자산 내장 확인 (assets/public 안에 index.html 있어야 함) ==="
          unzip -l 냉장고를부탁해.apk | grep -E "assets/public|capacitor.config" | head -10

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 냉장고를부탁해-APK
          path: 냉장고를부탁해.apk
          if-no-files-found: error
