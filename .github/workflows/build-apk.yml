name: Build Android APK (냉장고를 부탁해)

# 게임을 APK 안에 통째로 내장(Capacitor)해서 빌드합니다.
#  · 로컬에 Android 도구(JDK·SDK)가 없어 GitHub 클라우드 러너에서 빌드합니다.
#  · 완성된 APK 는 Actions 실행 결과 페이지의 Artifacts 에서 내려받습니다.
#  · 대회 USB 제출용 — 게임이 APK 안에 들어 있어 인터넷 없이 실행됩니다.
#    (조별 실시간 협력 기능만 인터넷 필요 — MQTT)

on:
  workflow_dispatch:        # Actions 탭에서 수동 실행
  push:
    branches: [main]
    paths:                  # 게임/설정이 바뀔 때 자동 재빌드
      - 'index.html'
      - 'manifest.webmanifest'
      - 'icon-512.png'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true

      # 게임은 단일 HTML 자립본이라 www/ 에 그것만 넣으면 된다.
      # PWA 전용 태그(매니페스트 링크·서비스워커 등록)는 APK 안에서는 불필요하므로 제거한다
      # — Capacitor 는 https://localhost 로 서비스해 SW 가 등록되는데, 자산이 이미 로컬이라 의미가 없고
      #   캐시가 끼면 갱신 혼선만 생긴다.
      - name: Bundle game into www/
        run: |
          rm -rf www && mkdir -p www
          cp index.html www/index.html
          # <link rel="manifest"> 와 서비스워커 등록 <script> 블록 제거
          python3 - <<'PY'
          import io, re
          p = 'www/index.html'
          s = io.open(p, encoding='utf-8').read()
          before = len(s)
          s = s.replace('<link rel="manifest" href="./manifest.webmanifest">', '')
          s = re.sub(r"<script>\s*//\s*서비스워커 등록.*?</script>", "", s, flags=re.S)
          io.open(p, 'w', encoding='utf-8').write(s)
          print('PWA 태그 제거: %d → %d bytes' % (before, len(s)))
          PY
          echo "=== www/ 내용 ===" && ls -1 www && du -sh www

      - name: Prepare Capacitor
        run: |
          cat > package.json <<'JSON'
          { "name": "fridge-apk", "version": "1.0.0", "private": true }
          JSON
          npm install @capacitor/core@^6 @capacitor/cli@^6 @capacitor/android@^6
          # 앱 ID·이름 — 블라인드 규칙(학교명·실명 제외) 준수. 교육자료전 앱과 ID가 겹치지 않게 분리
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "kr.classroom.fridge",
            "appName": "냉장고를 부탁해",
            "webDir": "www",
            "android": { "allowMixedContent": true },
            "server": { "androidScheme": "https" }
          }
          JSON

      - name: Add Android platform & sync
        run: |
          npx cap add android
          npx cap sync android

      # 요강(교육용SW·AI분과) 앱 최소 기준: Android 11(API 30) 이상
      - name: Set minSdkVersion 30 (요강 요건)
        run: |
          F=android/variables.gradle
          sed -i 's/minSdkVersion = [0-9]*/minSdkVersion = 30/' "$F"
          echo "=== variables.gradle ===" && cat "$F"

      - name: Apply app icon (icon-512.png)
        run: |
          SRC=icon-512.png
          if [ ! -f "$SRC" ]; then echo "no $SRC — 기본 아이콘 유지"; exit 0; fi
          if ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y imagemagick
          fi
          RES=android/app/src/main/res
          for pair in "mdpi 48" "hdpi 72" "xhdpi 96" "xxhdpi 144" "xxxhdpi 192"; do
            set -- $pair; d=$1; sz=$2
            dir="$RES/mipmap-$d"; mkdir -p "$dir"
            convert "$SRC" -background white -alpha remove -alpha off \
              -resize ${sz}x${sz} "$dir/ic_launcher.png"
            cp "$dir/ic_launcher.png" "$dir/ic_launcher_round.png"
          done
          # 적응형 아이콘 XML 제거 → 정사각 비트맵 그대로 표시(그림 잘림 방지)
          rm -f "$RES"/mipmap-anydpi-v26/ic_launcher.xml \
                "$RES"/mipmap-anydpi-v26/ic_launcher_round.xml

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Collect APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk 냉장고를부탁해.apk
          ls -lh 냉장고를부탁해.apk
          echo "=== 웹 자산 내장 확인 (assets/public 안에 index.html 있어야 함) ==="
          unzip -l 냉장고를부탁해.apk | grep -E "assets/public|capacitor.config" | head -10

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 냉장고를부탁해-APK
          path: 냉장고를부탁해.apk
          if-no-files-found: error
